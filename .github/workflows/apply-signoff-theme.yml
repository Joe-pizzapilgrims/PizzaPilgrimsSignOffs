name: Apply Sign-Off Theme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-signoff-theme.yml'
permissions:
  contents: write
jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add shared theme to UK sign-offs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'Assistant_Manager_Sign_Off_Interactive.html',
              'GM_Sign_Off_Interactive_v8.html',
              'Head_Chef_Sign_Off_Interactive.html',
              'Second_Chef_Sign_Off_Interactive.html',
              'Senior_Chef_Sign_Off_Interactive.html',
              'Supervisor_Sign_Off_Interactive.html',
          ]
          link = '<link rel="stylesheet" href="signoff-theme.css">'
          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if link in text:
                  print(f'{filename}: already themed')
                  continue
              new_text, count = re.subn(r'</style>\s*</head>', f'</style>\n{link}\n</head>', text, count=1, flags=re.I)
              if count != 1:
                  raise RuntimeError(f'Could not locate head style marker in {filename}')
              path.write_text(new_text, encoding='utf-8')
              print(f'{filename}: themed')
          PY
      - name: Commit changes
        run: |
          git config user.name "Joe-pizzapilgrims"
          git config user.email "joe@pizzapilgrims.co.uk"
          git add Assistant_Manager_Sign_Off_Interactive.html GM_Sign_Off_Interactive_v8.html Head_Chef_Sign_Off_Interactive.html Second_Chef_Sign_Off_Interactive.html Senior_Chef_Sign_Off_Interactive.html Supervisor_Sign_Off_Interactive.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply shared Academy theme to UK sign-offs"
            git push origin main
          fi