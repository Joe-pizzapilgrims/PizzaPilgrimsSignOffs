name: Update Supervisor show and tell tasks

on:
  push:
    paths:
      - '.github/workflows/update-supervisor-show-tell.yml'

permissions:
  contents: write

jobs:
  update-supervisor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace Supervisor show and tell tasks
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          path = Path('Supervisor_Sign_Off_Interactive.html')
          text = path.read_text(encoding='utf-8')

          match = re.search(r'(<script id="sections-data" type="application/json">)(.*?)(</script>)', text, flags=re.S)
          if not match:
              raise RuntimeError('Could not find sections-data JSON block')

          sections = json.loads(match.group(2))

          replacements = {
              'safety': 'In-depth food audit walk-around completed to a satisfactory standard, with all relevant issues identified and actioned.',
              'business': 'Morning KPI run-rate check completed, with a clear focus for the day/week successfully identified and communicated to the team.',
              'leadership': 'Great pre-shift delivered that is informative, educational and engaging.',
              'pizza': 'Awesome food audit conducted, with provenance shared through the lens of a “quick trip to Napoli”.',
              'guest': 'Trainee demonstrates they are an awesome shift leader, able to run shifts that are both fun and commercially successful.'
          }

          found = set()
          for section in sections:
              section_id = section.get('id')
              if section_id in replacements:
                  section['show'] = [replacements[section_id]]
                  found.add(section_id)

          missing = set(replacements) - found
          if missing:
              raise RuntimeError(f'Missing expected sections: {sorted(missing)}')

          new_json = json.dumps(sections, ensure_ascii=False)
          updated = text[:match.start(2)] + new_json + text[match.end(2):]
          path.write_text(updated, encoding='utf-8')

      - name: Commit Supervisor changes
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Supervisor_Sign_Off_Interactive.html
          git commit -m "Reduce Supervisor show and tell to one task per section"
          git push origin main
