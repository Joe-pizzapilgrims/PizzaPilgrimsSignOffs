name: Apply UK sign-off feedback batch

on:
  push:
    paths:
      - '.github/workflows/uk-signoff-feedback-batch.yml'

permissions:
  contents: write

jobs:
  update-signoffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply UK sign-off improvements
        shell: python
        run: |
          from pathlib import Path
          import json, re

          files = [
              Path('Supervisor_Sign_Off_Interactive.html'),
              Path('Assistant_Manager_Sign_Off_Interactive.html'),
              Path('GM_Sign_Off_Interactive_v8.html'),
              Path('Senior_Chef_Sign_Off_Interactive.html'),
              Path('Second_Chef_Sign_Off_Interactive.html'),
              Path('Head_Chef_Sign_Off_Interactive.html'),
          ]

          show_tasks = {
              'safety': 'In-depth food audit walk-around completed to a satisfactory standard, with all relevant issues identified and actioned.',
              'business': 'Morning KPI run-rate check completed, with a clear focus for the day/week successfully identified and communicated to the team.',
              'leadership': 'Great pre-shift delivered that is informative, educational and engaging.',
              'pizza': 'Awesome food audit conducted, with provenance shared through the lens of a “quick trip to Napoli”.',
              'guest': 'Trainee demonstrates they are an awesome shift leader, able to run shifts that are both fun and commercially successful.',
          }

          beforeprint_js = '''\n<script>\nconst signOffPrintHeights = new Map();\nwindow.addEventListener('beforeprint', () => {\n  document.querySelectorAll('textarea').forEach(textarea => {\n    signOffPrintHeights.set(textarea, textarea.style.height);\n    textarea.style.height = 'auto';\n    textarea.style.height = `${textarea.scrollHeight}px`;\n    textarea.style.overflow = 'visible';\n  });\n});\nwindow.addEventListener('afterprint', () => {\n  document.querySelectorAll('textarea').forEach(textarea => {\n    textarea.style.height = signOffPrintHeights.get(textarea) || '';\n    textarea.style.overflow = '';\n  });\n  signOffPrintHeights.clear();\n});\n</script>\n'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              match = re.search(r'(<script id="sections-data" type="application/json">)(.*?)(</script>)', text, re.S)
              if not match:
                  raise RuntimeError(f'Could not find sections data in {path}')

              sections = json.loads(match.group(2))
              seen = set()
              for section in sections:
                  section_id = section.get('id')
                  if section_id in show_tasks:
                      section['show'] = [show_tasks[section_id]]
                      seen.add(section_id)

              missing = set(show_tasks) - seen
              if missing:
                  raise RuntimeError(f'Missing expected sections in {path}: {sorted(missing)}')

              encoded = json.dumps(sections, ensure_ascii=False)
              text = text[:match.start(2)] + encoded + text[match.end(2):]

              # #13: expand assessor comment boxes to full content in print/PDF.
              if 'signOffPrintHeights' not in text:
                  text = text.replace('</body></html>', beforeprint_js + '</body></html>', 1)

              if text == original:
                  raise RuntimeError(f'No changes made to {path}')
              path.write_text(text, encoding='utf-8')

      - name: Commit UK sign-off improvements
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Supervisor_Sign_Off_Interactive.html Assistant_Manager_Sign_Off_Interactive.html GM_Sign_Off_Interactive_v8.html Senior_Chef_Sign_Off_Interactive.html Second_Chef_Sign_Off_Interactive.html Head_Chef_Sign_Off_Interactive.html
          git commit -m "Apply UK sign-off feedback 7 to 13"
          git push origin main
